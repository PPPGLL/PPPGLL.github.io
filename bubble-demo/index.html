<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gaole Pan 的实时 WebGL2 肥皂泡薄膜干涉渲染演示。">
  <meta name="theme-color" content="#07111f">
  <title>Bubble Lab · WebGL2 Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2f7ff;
      --muted: #9aacbe;
      --panel: rgba(8, 20, 34, .76);
      --line: rgba(196, 224, 255, .16);
      --accent: #79d8ff;
      --accent-2: #d6a4ff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07111f;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { min-height: 100dvh; }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    canvas.dragging { cursor: grabbing; }

    .topbar {
      position: fixed;
      z-index: 3;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: max(18px, env(safe-area-inset-top)) 24px 18px;
      pointer-events: none;
    }

    .brand, .back-link, .control-panel, .hint { pointer-events: auto; }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,.9) 0 3%, transparent 4%),
        conic-gradient(from 30deg, #79d8ff, #d6a4ff, #ff9db5, #f2e779, #79d8ff);
      box-shadow: inset 0 0 0 6px rgba(7, 17, 31, .78), 0 0 24px rgba(121, 216, 255, .24);
    }

    .brand strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      letter-spacing: .01em;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .back-link {
      padding: 8px 12px;
      color: #dcecff;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(7, 17, 31, .55);
      backdrop-filter: blur(12px);
      font-size: 13px;
      text-decoration: none;
      transition: border-color .2s ease, background .2s ease;
    }

    .back-link:hover, .back-link:focus-visible {
      border-color: rgba(121, 216, 255, .6);
      background: rgba(17, 40, 62, .78);
      outline: none;
    }

    .control-panel {
      position: fixed;
      z-index: 3;
      left: 24px;
      bottom: max(24px, env(safe-area-inset-bottom));
      width: min(330px, calc(100vw - 48px));
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .28);
      backdrop-filter: blur(18px) saturate(1.2);
    }

    .panel-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .panel-heading h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 600;
    }

    #bubble-count {
      color: var(--muted);
      font-size: 12px;
    }

    .control {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 12px;
      margin: 13px 0;
    }

    .control label {
      color: #d8e5f2;
      font-size: 13px;
    }

    .control output {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }

    input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      height: 4px;
      margin: 4px 0 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 42px;
      gap: 8px;
      margin-top: 17px;
    }

    button {
      min-height: 38px;
      padding: 0 13px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 255, 255, .07);
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover, button:focus-visible {
      border-color: rgba(121, 216, 255, .55);
      background: rgba(121, 216, 255, .12);
      outline: none;
    }

    button.primary {
      color: #06121e;
      border-color: transparent;
      background: linear-gradient(120deg, var(--accent), #c3efff);
    }

    .hint {
      position: fixed;
      z-index: 2;
      right: 24px;
      bottom: max(25px, env(safe-area-inset-bottom));
      max-width: 290px;
      color: rgba(222, 237, 250, .62);
      font-size: 12px;
      line-height: 1.55;
      text-align: right;
      text-shadow: 0 1px 10px #07111f;
    }

    .error {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      place-items: center;
      padding: 30px;
      background: #07111f;
      text-align: center;
    }

    .error.visible { display: grid; }
    .error div { max-width: 520px; }
    .error h1 { font-family: Georgia, serif; }
    .error p { color: var(--muted); line-height: 1.7; }

    @media (max-width: 700px) {
      .topbar { padding-inline: 16px; }
      .brand span { display: none; }
      .control-panel {
        left: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        width: calc(100vw - 24px);
        padding: 14px;
      }
      .control { margin: 9px 0; }
      .hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="可交互的肥皂泡 WebGL2 渲染"></canvas>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div><strong>Bubble Lab</strong><span>Thin-film interference · WebGL2</span></div>
    </div>
    <a class="back-link" href="../#projects">返回主页</a>
  </header>

  <aside class="control-panel" aria-label="渲染参数">
    <div class="panel-heading">
      <h1>实时泡泡实验</h1>
      <span id="bubble-count">0 个泡泡</span>
    </div>

    <div class="control">
      <label for="thickness">薄膜厚度</label>
      <output id="thickness-value" for="thickness">430 nm</output>
      <input id="thickness" type="range" min="180" max="950" step="1" value="430">
    </div>

    <div class="control">
      <label for="flow">厚度流动</label>
      <output id="flow-value" for="flow">45%</output>
      <input id="flow" type="range" min="0" max="100" step="1" value="45">
    </div>

    <div class="control">
      <label for="tension">表面张力</label>
      <output id="tension-value" for="tension">55%</output>
      <input id="tension" type="range" min="10" max="100" step="1" value="55">
    </div>

    <div class="actions">
      <button class="primary" id="add" type="button">吹一个泡泡</button>
      <button id="reset" type="button">重置场景</button>
      <button id="pause" type="button" aria-pressed="false" aria-label="暂停动画">Ⅱ</button>
    </div>
  </aside>

  <p class="hint">拖动泡泡改变位置 · 双击空白处生成泡泡<br>实时计算薄膜干涉、菲涅耳反射与厚度流动</p>

  <section class="error" id="error" role="alert">
    <div>
      <h1>浏览器暂不支持 WebGL2</h1>
      <p>请使用最新版 Chrome、Edge、Firefox 或 Safari，并确认浏览器已启用硬件加速。</p>
      <a class="back-link" href="../#projects">返回主页</a>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
